name: Bug report
description: Something in the launcher doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please leave out personal information, and report
        security problems privately (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: input
    id: launcher-version
    attributes:
      label: Launcher version
      description: Shown at the bottom of the sidebar and on the About page.
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2
  - type: input
    id: game-version
    attributes:
      label: Game version
      description: As shown on the My game page.
      placeholder: e.g. GTA San Andreas v1.0 (US)
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic report
      description: >-
        Diagnostics → "Export report…" creates a zip with your user name, computer name and
        profile paths removed; attach it here. Or paste the text from Diagnostics → "Copy summary".
