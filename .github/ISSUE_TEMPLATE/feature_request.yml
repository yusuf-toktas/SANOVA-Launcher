name: Feature request
description: Suggest an improvement to the launcher.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation and why the current behavior falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Features that need copy-protection workarounds, or that redistribute the game or mods
        without their authors' permission, are out of scope.
