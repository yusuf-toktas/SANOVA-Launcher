name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SANOVA.Launcher.slnx

      # CI=true (set by GitHub Actions) turns warnings into errors, see Directory.Build.props.
      - name: Build
        run: dotnet build SANOVA.Launcher.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test SANOVA.Launcher.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results and UI snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: |
            TestResults
            tests/Sanova.Launcher.Tests/snapshots
          if-no-files-found: ignore
          retention-days: 14
