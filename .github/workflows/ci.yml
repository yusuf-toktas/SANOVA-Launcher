name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SANOVA.Launcher.slnx

      # CI=true (set by GitHub Actions) turns warnings into errors, see Directory.Build.props.
      - name: Build
        run: dotnet build SANOVA.Launcher.slnx -c Release --no-restore

      - name: Test
        run: dotnet test SANOVA.Launcher.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results and UI snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            TestResults
            tests/Sanova.Launcher.Tests/snapshots
          if-no-files-found: ignore
          retention-days: 14
